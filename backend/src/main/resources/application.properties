# Server config
server.port=8085

# Database config (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:transitops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
transitops.jwt.secret=9a4f2c8d3e7b1a5c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
# 1 day in milliseconds (24 * 60 * 60 * 1000)
transitops.jwt.expiration=86400000

# Allow circular references
spring.main.allow-circular-references=true

