# Server config
server.port=8080

# Database config (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/transitops
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
transitops.jwt.secret=9a4f2c8d3e7b1a5c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
# 1 day in milliseconds (24 * 60 * 60 * 1000)
transitops.jwt.expiration=86400000
